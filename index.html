<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Central de Dados · Amigos do Barça FC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0A0A0B; --bg-2:#0E0E10; --bg-card:#161618; --bg-card-2:#1C1C1F;
    --border:#242427; --accent:#FF6A00; --accent-2:#FFB067; --accent-glow:rgba(255,106,0,.35);
    --text:#F4F4F2; --text-dim:#93939A; --text-faint:#5A5A60; --green:#31D07A;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{margin:0; background:var(--bg); color:var(--text); font-family:'Inter',sans-serif; line-height:1.5; overflow-x:hidden;}
  h1,h2,h3,.display{font-family:'Oswald',sans-serif;}
  a{color:var(--accent); text-decoration:none;}
  img{max-width:100%; display:block;}
  ::selection{background:var(--accent); color:#0A0A0B;}

  .reveal{opacity:0; transform:translateY(14px); transition:opacity .6s ease, transform .6s ease;}
  .reveal.in{opacity:1; transform:none;}

  /* ---- hero ---- */
  .hero{
    position:relative; padding:70px 24px 46px; text-align:center; overflow:hidden;
    background:
      radial-gradient(700px 360px at 50% -100px, var(--accent-glow), transparent 70%),
      linear-gradient(180deg, var(--bg-2), var(--bg));
    border-bottom:1px solid var(--border);
  }
  .hero::before{
    content:''; position:absolute; inset:0; opacity:.04; pointer-events:none;
    background-image: repeating-linear-gradient(90deg, transparent, transparent 78px, var(--accent) 78px, var(--accent) 79px);
  }
  .crest-wrap{width:92px; height:92px; margin:0 auto 16px; position:relative;}
  .crest-wrap img{width:100%; height:100%; object-fit:contain; filter:drop-shadow(0 8px 24px var(--accent-glow)); animation:floaty 5s ease-in-out infinite;}
  @keyframes floaty{0%,100%{transform:translateY(0);}50%{transform:translateY(-6px);}}
  .hero .kicker{color:var(--accent); font-weight:600; font-size:.78rem; letter-spacing:2.5px; font-family:'Oswald',sans-serif;}
  .hero h1{font-size:clamp(1.8rem,5vw,2.6rem); letter-spacing:.5px; margin:8px 0 6px; color:#fff;}
  .hero .season-note{color:var(--text-dim); font-size:.85rem; margin-top:8px;}
  .live-dot{display:inline-block; width:7px; height:7px; border-radius:50%; background:var(--green); margin-right:6px; box-shadow:0 0 0 0 rgba(49,208,122,.6); animation:pulse 2s infinite;}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(49,208,122,.55);}70%{box-shadow:0 0 0 8px rgba(49,208,122,0);}100%{box-shadow:0 0 0 0 rgba(49,208,122,0);}}

  .stat-strip{display:flex; justify-content:center; gap:0; flex-wrap:wrap; margin-top:34px;}
  .stat-strip .stat{padding:0 28px; text-align:center; border-right:1px solid var(--border);}
  .stat-strip .stat:last-child{border-right:none;}
  .stat-strip .stat b{display:block; font-family:'Oswald',sans-serif; font-size:1.7rem; color:var(--accent-2);}
  .stat-strip .stat span{font-size:.68rem; color:var(--text-faint); letter-spacing:.6px; text-transform:uppercase;}

  /* ---- tabs ---- */
  .tabbar{
    position:sticky; top:0; z-index:20; display:flex; justify-content:center; gap:4px;
    background:rgba(10,10,11,.88); backdrop-filter:blur(10px); border-bottom:1px solid var(--border);
    padding:12px; flex-wrap:wrap;
  }
  .tabbar button{
    background:none; border:none; color:var(--text-dim); padding:9px 18px; cursor:pointer;
    font-family:'Oswald',sans-serif; font-size:.82rem; letter-spacing:.4px; border-radius:20px; transition:.15s;
  }
  .tabbar button:hover{color:var(--text); background:var(--bg-card);}
  .tabbar button.active{color:#0B0B0C; background:var(--accent);}

  main{max-width:1140px; margin:0 auto; padding:36px 20px 60px;}
  .subnav{display:flex; justify-content:center; gap:6px; flex-wrap:wrap; margin-bottom:28px;}
  .subnav button{
    background:var(--bg-card); border:1px solid var(--border); color:var(--text-dim); padding:9px 16px;
    border-radius:20px; cursor:pointer; font-size:.76rem; font-family:'Oswald',sans-serif; letter-spacing:.3px; transition:.15s;
  }
  .subnav button.active{border-color:var(--accent); color:var(--accent); background:rgba(255,106,0,.08);}
  .subnav button:disabled{opacity:.3; cursor:default;}

  /* ---- leader card ---- */
  .leader{
    max-width:440px; margin:0 auto 34px; padding:30px 34px; border-radius:16px; text-align:center; position:relative; overflow:hidden;
    background:linear-gradient(145deg, var(--accent) 0%, #B84400 100%); color:#180D00;
    box-shadow:0 24px 50px -14px var(--accent-glow);
  }
  .leader::after{content:'🏆'; position:absolute; font-size:5rem; opacity:.12; right:-6px; bottom:-18px; transform:rotate(-12deg);}
  .leader .tag{font-size:.72rem; font-weight:700; letter-spacing:1.8px; opacity:.75; font-family:'Oswald',sans-serif;}
  .leader h2{font-size:2.1rem; margin:6px 0 2px; position:relative; z-index:1;}
  .leader .n{font-size:.85rem; font-weight:600; opacity:.85; position:relative; z-index:1;}

  .grid{display:grid; grid-template-columns:repeat(auto-fit, minmax(300px,1fr)); gap:18px;}
  .card{
    background:var(--bg-card); border:1px solid var(--border); border-radius:14px; padding:20px 22px 8px;
    border-left:3px solid var(--accent); transition:transform .2s ease, border-color .2s ease;
  }
  .card:hover{transform:translateY(-3px); border-color:var(--accent-2);}
  .card h3{font-size:.86rem; margin:0 0 12px; text-transform:uppercase; letter-spacing:.6px; color:var(--text); font-weight:600; display:flex; align-items:center; gap:8px;}
  table{width:100%; border-collapse:collapse;}
  th{text-align:left; font-size:.64rem; color:var(--text-faint); font-weight:600; letter-spacing:.4px; padding:6px 6px; text-transform:uppercase;}
  td{padding:10px 6px; border-top:1px solid #1E1E21; font-size:.86rem;}
  td.pos{width:24px; color:var(--text-faint); font-family:'Oswald',sans-serif; font-weight:600;}
  tr:first-child td.pos{color:var(--accent);}
  td.val{color:var(--accent-2); font-weight:700; text-align:center; font-family:'Oswald',sans-serif;}
  td.avg{color:var(--green); font-weight:700; text-align:center; font-family:'Oswald',sans-serif;}
  small{color:var(--text-faint); font-weight:400;}

  .curio-strip{display:flex; flex-direction:column; gap:14px; margin-bottom:26px;}
  .curio-card{
    display:flex; align-items:center; gap:18px; background:var(--bg-card-2); border:1px solid var(--border); border-radius:14px;
    padding:18px 22px; position:relative; overflow:hidden;
  }
  .curio-card .ic{font-size:1.8rem; flex:0 0 auto;}
  .curio-card p{font-size:.9rem; color:var(--text); margin:0; line-height:1.4;}
  .curio-card::before{content:''; position:absolute; top:0; bottom:0; left:0; width:3px; background:var(--accent);}

  .section-title{display:flex; align-items:center; gap:10px; margin:0 0 16px; font-size:1rem; color:var(--text);}
  .section-title .bar{width:4px; height:18px; background:var(--accent); border-radius:2px;}

  .empty{text-align:center; color:var(--text-dim); padding:60px 20px; font-size:.9rem;}

  footer{text-align:center; padding:44px 20px 60px; border-top:1px solid var(--border); margin-top:20px;}
  .insta-btn{
    display:inline-flex; align-items:center; gap:8px; background:linear-gradient(45deg,#f09433,#bc1888);
    color:#fff; padding:12px 24px; border-radius:24px; font-weight:600; font-size:.85rem; transition:.2s;
  }
  .insta-btn:hover{transform:translateY(-2px); box-shadow:0 8px 20px rgba(188,24,136,.35);}
  footer .credit{display:block; margin-top:16px; color:var(--text-faint); font-size:.72rem;}
  @media (max-width:600px){ .hero h1{font-size:1.5rem;} .stat-strip .stat{padding:0 16px;} }
</style>
</head>
<body>

<div class="hero">
  <div class="crest-wrap"><img src="logobarca.png" alt="Amigos do Barça FC"></div>
  <div class="kicker">AMIGOS DO BARÇA F.C. · DESDE 2013</div>
  <h1>Central de Dados ABFC</h1>
  <div class="season-note"><span class="live-dot"></span><span id="seasonNote">Carregando…</span></div>
  <div class="stat-strip" id="statStrip"></div>
</div>

<div class="tabbar" id="tabbar">
  <button data-tab="geral" class="active">Geral</button>
  <button data-tab="mensal">Mensal</button>
  <button data-tab="temporadas">Temporadas</button>
  <button data-tab="historico">Histórico</button>
  <button data-tab="arquivo">Arquivo</button>
</div>

<main>
  <div id="content" class="empty">Carregando dados…</div>
</main>

<footer>
  <a class="insta-btn" href="https://www.instagram.com/amigosbarcafc/" target="_blank">📸 Siga @amigosbarcafc</a>
  <span class="credit">Dados atualizados automaticamente após cada rodada</span>
  <span class="credit">Website desenvolvido por Alexandre Gabbia</span>
</footer>

<script src="abfc-stats.js"></script>
<script>
let DATA = null;
let activeTab = 'temporadas';

function animateNumber(el, to){
  let start = 0; const dur = 900; const t0 = performance.now();
  function step(t){
    const p = Math.min(1, (t-t0)/dur);
    el.textContent = Math.round(start + (to-start) * (1 - Math.pow(1-p, 3)));
    if (p < 1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

function observeReveal(){
  const els = document.querySelectorAll('.reveal:not(.in)');
  const io = new IntersectionObserver(entries=>{
    entries.forEach(e=>{ if (e.isIntersecting){ e.target.classList.add('in'); io.unobserve(e.target); } });
  }, {threshold:.15});
  els.forEach(el=> io.observe(el));
}

async function boot(){
  DATA = await ABFC.loadAllData('');
  const seasonRounds = DATA.allRounds.filter(r=>r.year===DATA.currentYear);
  const lastRound = seasonRounds[seasonRounds.length-1];

  document.getElementById('seasonNote').textContent = lastRound
    ? `Temporada ${DATA.currentYear} · atualizado após a rodada de ${fmtDate(lastRound.data)}`
    : `Temporada ${DATA.currentYear}`;

  const d = ABFC.calcular(seasonRounds);
  const totalGols = Object.values(d.g).reduce((a,b)=>a+b,0);
  const totalAssists = Object.values(d.a).reduce((a,b)=>a+b,0);
  const strip = document.getElementById('statStrip');
  [
    ['Rodadas', seasonRounds.length],
    ['Gols na temporada', totalGols],
    ['Assistências', totalAssists],
    ['Atletas ativos', Object.keys(d.j).length],
  ].forEach(([label, val])=>{
    const box = document.createElement('div'); box.className = 'stat';
    box.innerHTML = `<b>0</b><span>${label}</span>`;
    strip.appendChild(box);
    animateNumber(box.querySelector('b'), val);
  });

  document.querySelectorAll('.tabbar button').forEach(b=>{
    b.onclick = ()=>{ activeTab = b.dataset.tab; render(); };
  });
  render();
}

function fmtDate(iso){ const [y,m,d]=iso.split('-'); return `${d}/${m}/${y}`; }

function render(){
  document.querySelectorAll('.tabbar button').forEach(b=> b.classList.toggle('active', b.dataset.tab===activeTab));
  const box = document.getElementById('content');

  if (activeTab === 'geral'){
    const seasonRounds = DATA.allRounds.filter(r=>r.year===DATA.currentYear);
    box.innerHTML = renderCuriosidades(seasonRounds) + renderSecao(ABFC.calcular(seasonRounds));
  }
  else if (activeTab === 'mensal'){
    box.innerHTML = `<div class="subnav" id="monthNav"></div><div id="monthBody"></div>`;
    const nav = document.getElementById('monthNav');
    const curMonth = new Date().getMonth()+1;
    let defaultBtn = null;
    ABFC.MONTHS.forEach((name, i)=>{
      const m = i+1;
      const hasData = DATA.allRounds.some(r=>r.year===DATA.currentYear && r.month===m);
      const btn = document.createElement('button');
      btn.textContent = name.slice(0,3);
      if (!hasData) btn.disabled = true;
      btn.onclick = ()=>{
        [...nav.children].forEach(c=>c.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById('monthBody').innerHTML = renderSecao(ABFC.calcular(DATA.allRounds.filter(r=>r.year===DATA.currentYear && r.month===m)));
      };
      nav.appendChild(btn);
      if (m === curMonth && hasData) defaultBtn = btn;
    });
    (defaultBtn || [...nav.children].find(b=>!b.disabled))?.click();
  }
  else if (activeTab === 'temporadas'){
    box.innerHTML = `<div class="subnav" id="seasonNav"></div><div id="seasonBody"></div>`;
    const nav = document.getElementById('seasonNav');
    const curMonth = new Date().getMonth()+1;
    let defaultIdx = ABFC.SEASONS.findIndex(s => s.months.includes(curMonth));
    if (defaultIdx < 0) defaultIdx = 0;
    ABFC.SEASONS.forEach((s, i)=>{
      const btn = document.createElement('button');
      btn.textContent = s.label;
      btn.onclick = ()=>{
        [...nav.children].forEach(c=>c.classList.remove('active'));
        btn.classList.add('active');
        const rounds = DATA.allRounds.filter(r=>r.year===DATA.currentYear && s.months.includes(r.month));
        document.getElementById('seasonBody').innerHTML = renderCuriosidades(rounds) + renderSecao(ABFC.calcular(rounds));
      };
      nav.appendChild(btn);
    });
    nav.children[defaultIdx].click();
  }
  else if (activeTab === 'historico'){
    const geralTudo = ABFC.calcular(DATA.allRounds);
    let g = {...geralTudo.g}, a = {...geralTudo.a};
    Object.values(DATA.legacy).forEach(yd=>{ g = ABFC.mergeCounters(g, yd.gols||{}); a = ABFC.mergeCounters(a, yd.assists||{}); });
    box.innerHTML = renderSecao({g, a, ga: ABFC.mergeCounters(g,a), j: geralTudo.j}, true);
  }
  else if (activeTab === 'arquivo'){
    const d = ABFC.calcular(DATA.allRounds.filter(r=>r.year===DATA.currentYear));
    let html = `<div class="section-title"><span class="bar"></span>Arquivo histórico de destaques</div><div class="grid">`;
    Object.entries(ABFC.CATEGORIAS_ARQUIVO).forEach(([key, label])=>{
      html += `<div class="card reveal"><h3>${label}</h3><table>` +
        ABFC.topN(d.cat[key], 5).map(([n,v],i)=> `<tr><td class="pos">${i+1}</td><td>${n}</td><td class="val">${v}x</td></tr>`).join('') +
        `</table></div>`;
    });
    box.innerHTML = html + '</div>';
  }
  observeReveal();
}

function renderCuriosidades(seasonRounds){
  if (!seasonRounds.length) return '';
  const last = seasonRounds[seasonRounds.length-1];
  const curios = ABFC.curiosidadesDaRodada(DATA.allRounds, DATA.legacy, last);
  if (!curios.length) return '';
  return `<div class="section-title"><span class="bar"></span>Curiosidades da última rodada (${fmtDate(last.data)})</div>
    <div class="curio-strip">${curios.map(c=>`<div class="curio-card reveal"><div class="ic">${c.icon}</div><p>${c.text}</p></div>`).join('')}</div>`;
}

function renderSecao(d, isHistorico=false){
  const lider = ABFC.topN(d.ga, 1)[0];
  const leaderHtml = lider ? `
    <div class="leader reveal">
      <div class="tag">LÍDER MVP</div>
      <h2>${lider[0]}</h2>
      <div class="n">${lider[1]} participações em gols</div>
    </div>` : '';

  function table(title, icon, counter, matches, unitLabel){
    const rows = ABFC.topN(counter, 10);
    if (!rows.length) return `<div class="card reveal"><h3>${icon} ${title}</h3><div style="padding:16px 0;color:var(--text-faint);font-size:.82rem;">Sem dados neste recorte</div></div>`;
    const body = rows.map(([n,v],i)=>{
      const m = matches[n] || 0;
      const media = m > 0 ? (v/m).toFixed(2) : '0.00';
      const mediaCol = isHistorico ? '' : `<td class="avg">${media} <small>${unitLabel}</small></td>`;
      return `<tr><td class="pos">${i+1}</td><td>${n} <small>(${m}j)</small></td><td class="val">${v}</td>${mediaCol}</tr>`;
    }).join('');
    const head = isHistorico ? '' : `<th>${unitLabel}</th>`;
    return `<div class="card reveal"><h3>${icon} ${title}</h3><table><tr><th>#</th><th>Atleta</th><th>Tot</th>${head}</tr>${body}</table></div>`;
  }

  return leaderHtml + `<div class="grid">
    ${table('Ranking MVP', '🏆', d.ga, d.j, 'PPJ')}
    ${table('Artilharia', '⚽', d.g, d.j, 'GPJ')}
    ${table('Assistências', '👟', d.a, d.j, 'APJ')}
  </div>`;
}

boot();
</script>
</body>
</html>
